    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .pixel-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 0.2);
        }

        .active-pixel-shadow {
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 0.2);
        }

        .dotted-path {
            background-image: radial-gradient(circle, #71787a 20%, transparent 20%);
            background-position: 0 0;
            background-size: 20px 20px;
        }

        /* 1. 蓝色背景下的白色像素动态化 */
        .map-canvas-container::before {
            content: "";
            position: absolute;
            /* 确保 inset 足够大以覆盖动画位移产生的边缘空白 */
            inset: -100px;

            /* 修复方案：使用两个线性渐变重合来画出正方形 */
            /* 第一个 gradient 画垂直线，第二个画水平线，交叉点即为正方形 */
            background: radial-gradient(rgba(255, 255, 255, 0.5) 25%, transparent 25%);
            background-size: 16px 16px;
            background-repeat: repeat;

            /* 动画时间缩短可以让流动感更明显 */
            animation: pixelFloat 20s linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes pixelFloat {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(64px, 0px);
            }
        }

        /* 2. 虚线流动动画 */
        .path-flow {
            stroke-dasharray: 8, 8;
            animation: dashFlow 1s linear infinite;
        }

        @keyframes dashFlow {
            to {
                stroke-dashoffset: -16;
            }
        }

        /* 呼吸灯效果：用于进行中的模块 */
        .status-active::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: rgba(0, 104, 79, 0.2);
            animation: pulseActive 2s infinite;
        }

        @keyframes pulseActive {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* 锁定状态：灰度处理 */
        .status-locked {
            filter: grayscale(1);
            opacity: 0.7;
            cursor: not-allowed;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #eaf2f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #00684f;
            border-radius: 0px;
        }
    </style>
</head>

    <script>
        // 页面特有逻辑：资源分类过滤
        function initResourceFilter() {
            const filterBtns = document.querySelectorAll('[data-category]');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.getAttribute('data-category');
                    console.log(`正在过滤分类: ${category}`);
                });
            });
        }

        // 主程序：统一管理所有初始化行为
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. 调用公共初始化（注入导航并执行 syncNavLinks）
                // 确保 main.js 里的 syncNavLinks 能匹配到 "map.html"
                await initApp();

                // 2. 执行 map.html 特有的 Tooltip 交互逻辑
                const tooltip = document.getElementById('pixel-tooltip');
                const tooltipModule = document.getElementById('tooltip-module');
                const tooltipTitle = document.getElementById('tooltip-title');

                if (tooltip) {
                    document.addEventListener('mousemove', (e) => {
                        tooltip.style.left = e.clientX + 'px';
                        tooltip.style.top = e.clientY + 'px';
                    });

                    const islands = document.querySelectorAll('.group');
                    islands.forEach(island => {
                        island.addEventListener('mouseenter', () => {
                            const p = island.querySelector('p');
                            const h3 = island.querySelector('h3');
                            if (p && h3) {
                                tooltipModule.innerText = p.innerText;
                                tooltipTitle.innerText = h3.innerText;
                                tooltip.classList.replace('opacity-0', 'opacity-100');
                            }
                        });
                        island.addEventListener('mouseleave', () => {
                            tooltip.classList.replace('opacity-100', 'opacity-0');
                        });
                    });
                }

                // 3. 执行其他初始化
                initResourceFilter();
                console.log("学习路径页面所有组件加载成功");

            } catch (e) {
                console.error("加载过程中出错:", e);
            }
        });
    </script>
    <div id="pixel-tooltip"
        class="fixed z-50 pointer-events-none opacity-0 transition-opacity duration-200 min-w-[140px] pointer-events-none"

            <h3 id="tooltip-title" class="font-headline text-xs font-black uppercase text-black"></h3>
        </div>
